services:
  nginx:
    image: nginx:alpine
    container_name: ava_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/ava:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  
  app:
    build:
      dockerfile: Dockerfile
    container_name: ava_app
    volumes:
      - ./:/var/www/ava/
    environment:
      TMPDIR: /var/www/ava/storage/tmp

  db:
    image: postgres:18.6-alpine3.24
    container_name: ava_db
    environment:
      POSTGRES_DB: ava
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
    ports:
    - "5432:5432"

